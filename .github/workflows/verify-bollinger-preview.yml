name: Verify Bollinger preview and VPA catalogue

on:
  push:
    branches:
      - my-new-branch
    paths:
      - "course-source/understand-bollinger-bands/preview/first-pass/index.html"
      - "course-source/understand-bollinger-bands/preview/template-reference/index.html"
      - "course-source/understand-bollinger-bands/assets/bollinger-lessons-data.js"
      - "course-source/understand-bollinger-bands/assets/student-assets/svg/**"
      - "backend/apps/academy/importing.py"
      - "backend/apps/academy/models.py"
      - "backend/tests/academy/test_course_import_workflow.py"
      - "site/assets/course-content-admin-editor.js"
      - "site/assets/instructional-image-admin.js"
      - "site/assets/course-catalogue-data.js"
      - "site/assets/courses-catalogue.js"
      - "site/courses.html"
      - "tools/qa/check_bollinger_preview.py"
      - ".github/workflows/verify-bollinger-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check shared scripts and catalogue contracts
        run: |
          node --check site/assets/course-content-admin-editor.js
          node --check site/assets/instructional-image-admin.js
          node --check site/assets/courses-catalogue.js
          python tools/qa/check_bollinger_preview.py
      - name: Check inline course JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ("first-pass", "template-reference"):
              path = Path(f"course-source/understand-bollinger-bands/preview/{name}/index.html")
              page = path.read_text(encoding="utf-8")
              blocks = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", page, flags=re.I)
              inline = [s for s in blocks if s.strip() and not re.search(r"^\s*window\.TRADETHESIS_MEDIA_PREVIEW_ONLY\s*=", s)]
              if not inline:
                  raise SystemExit(f"No inline course script found in {path}.")
              Path(f"/tmp/bollinger-{name}-preview.js").write_text("\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/bollinger-first-pass-preview.js
          node --check /tmp/bollinger-template-reference-preview.js
      - name: Validate authored Bollinger figure assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("course-source/understand-bollinger-bands/assets/student-assets/svg")
          figures = [root / f"bb-m{m:02d}-f{f:02d}.svg" for m in range(1, 8) for f in range(1, (7 if m == 5 else 5))]
          if len(figures) != 30:
              raise SystemExit(f"Expected 30 figure assets, found {len(figures)}")
          forbidden = ("<script", "<foreignObject", "href=", "style=", "<image", "<use", "url(", "javascript:", "data:")
          for path in figures:
              if not path.is_file():
                  raise SystemExit(f"Missing authored figure: {path}")
              source = path.read_text(encoding="utf-8").lower()
              if any(token in source for token in forbidden):
                  raise SystemExit(f"Potentially active/external SVG content found in {path}")
              svg = ET.parse(path).getroot()
              if svg.tag.rsplit("}", 1)[-1] != "svg" or "viewBox" not in svg.attrib:
                  raise SystemExit(f"Invalid SVG root or viewBox: {path}")
              tags = {node.tag.rsplit("}", 1)[-1] for node in svg}
              if not {"title", "desc"}.issubset(tags):
                  raise SystemExit(f"Missing accessible title/description: {path}")
          print("All 30 source SVG figures exist, parse as XML and include accessible metadata.")
          PY
