name: Temporary Lesson 5 Clear W ChartLab QA

on:
  push:
    branches:
      - automation/module5-chartlab-qa-20261016
    paths:
      - "site/**"
      - "course-content/support-resistance/chart_assets/source/build_chart_assets.py"
      - ".github/workflows/module5-chartlab-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
        with:
          ref: automation/module5-chartlab-qa-20261016

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate synthetic teaching charts
        run: |
          python -m pip install --upgrade pip matplotlib
          python course-content/support-resistance/chart_assets/source/build_chart_assets.py
          python - <<'PY'
          import csv, hashlib, subprocess
          from pathlib import Path
          
          root = Path("course-content/support-resistance/chart_assets")
          manifest_path = root / "asset_manifest.csv"
          sums_path = root / "SHA256SUMS.txt"
          generated_manifest = list(csv.DictReader(manifest_path.open(encoding="utf-8", newline="")))
          target_order = ["L05-A-04-minor-removed", "L05-A-05-nearby-combined"]
          target_ids = set(target_order)
          generated_rows = [r for r in generated_manifest if r["asset_id"] in target_ids]
          generated_by_id = {}
          for row in generated_rows:
              if row["asset_id"] in generated_by_id:
                  raise SystemExit("Generator emitted a duplicate target manifest row: " + row["asset_id"])
              generated_by_id[row["asset_id"]] = row
          if set(generated_by_id) != target_ids:
              raise SystemExit("Generator did not emit exactly one row for each incremental Lesson 5 chart state.")
          
          def manifest_line(row):
              return ",".join([
                  row["asset_id"], row["dataset_id"], row["state"], row["visible_bars"],
                  row["format"], row["source_type"],
                  '"' + row["alt_text"].replace('"', '""') + '"',
                  '"' + row["notes"].replace('"', '""') + '"'
              ])
          
          # Start from the committed manifest, remove any old copies of these target rows,
          # then insert exactly one fresh row per target after the Lesson 5 reference edit.
          original_manifest = subprocess.check_output(
              ["git", "show", "HEAD:course-content/support-resistance/chart_assets/asset_manifest.csv"],
              text=True
          )
          lines = [
              line for line in original_manifest.splitlines()
              if not any(line.startswith(asset_id + ",") for asset_id in target_ids)
          ]
          insert_at = next(i for i, line in enumerate(lines) if line.startswith("L05-A-03-reduced-reference,"))
          lines[insert_at + 1:insert_at + 1] = [manifest_line(generated_by_id[asset_id]) for asset_id in target_order]
          for asset_id in target_order:
              if sum(line.startswith(asset_id + ",") for line in lines) != 1:
                  raise SystemExit("Manifest must contain exactly one row for " + asset_id)
          manifest_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          
          # Refresh, rather than merely append, each target checksum. SVG metadata can change
          # when Matplotlib regenerates a chart, so an existing checksum is not authoritative.
          original_sums = subprocess.check_output(
              ["git", "show", "HEAD:course-content/support-resistance/chart_assets/SHA256SUMS.txt"],
              text=True
          ).splitlines()
          target_paths = []
          for asset_id in target_order:
              for ext in ("png", "svg"):
                  rel = f"course-content/support-resistance/chart_assets/charts/{asset_id}.{ext}"
                  target_paths.append(rel)
                  original_sums = [line for line in original_sums if not line.endswith("  " + rel)]
                  digest = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
                  original_sums.append(f"{digest}  {rel}")
          sums_path.write_text("\n".join(original_sums) + "\n", encoding="utf-8")
          
          # Fail the build if a target path is absent, duplicated, or stale in the checksum file.
          for rel in target_paths:
              matches = [line for line in original_sums if line.endswith("  " + rel)]
              actual = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if len(matches) != 1 or matches[0].split()[0] != actual:
                  raise SystemExit("Missing, duplicate, or incorrect checksum for " + rel)
          print("Manifest has one row per incremental chart; all four target checksums match regenerated files.")
          PY

      - name: Stage charts for the learning-room preview
        run: |
          python - <<'PY'
          import re, shutil
          from pathlib import Path
          source = Path("course-content/support-resistance/chart_assets/charts")
          app = Path("site/assets/support-resistance-room.js").read_text(encoding="utf-8")
          names = sorted(set(re.findall(r"([A-Za-z0-9_-]+[.]png)", app)))
          names = [n for n in names if n.startswith(("L","CL"))]
          missing = [n for n in names if not (source / n).is_file()]
          if missing: raise SystemExit("Missing chart assets: " + ", ".join(missing))
          target = Path("site/assets/support-resistance-charts")
          if target.exists(): shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)
          for name in names: shutil.copy2(source/name, target/name)
          if not (Path("site/chartlab/clear-w.html").is_file()):
              raise SystemExit("Embedded Clear W ChartLab page is missing from the site.")
          print(f"Staged {len(names)} referenced chart images.")
          PY

      - name: Install Chromium
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install chromium

      - name: Test editing sequence, real two-zone drawing and completion gate
        run: |
          python -m http.server 4173 --directory site >/tmp/lesson5-site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/support-resistance-room.html >/dev/null && break; sleep 1; done
          node <<'JS'
          const assert = require("node:assert/strict");
          const { chromium } = require("playwright");
          const AxeBuilder = require("@axe-core/playwright").default;

          async function runA11yScan(target, label) {
            const results = await new AxeBuilder({ page: target })
              .withTags(["wcag2a", "wcag2aa", "wcag21a", "wcag21aa"])
              .analyze();
            const violations = results.violations.map(v => ({
              id: v.id,
              impact: v.impact,
              help: v.help,
              helpUrl: v.helpUrl,
              affectedNodes: v.nodes.length,
              examples: v.nodes.slice(0, 5).map(n => ({
                target: n.target,
                summary: n.failureSummary
              }))
            }));
            console.log("AXE_A11Y_" + label + ": " + JSON.stringify({
              url: target.url(),
              violationCount: violations.length,
              violations
            }));
            const blockers = results.violations.filter(v =>
              v.impact === "critical" || v.impact === "serious"
            );
            assert.deepEqual(
              blockers.map(v => ({ id: v.id, impact: v.impact, nodes: v.nodes.length })),
              [],
              label + " has critical/serious accessibility violations; inspect the AXE_A11Y log."
            );
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const mainContext = await browser.newContext({viewport:{width:1365,height:950}});
            const page = await mainContext.newPage();
            const errors=[],bad=[];
            page.on("pageerror",e=>errors.push(e.message));
            page.on("response",r=>{if(r.status()>=400)bad.push(r.status()+" "+r.url())});
            await page.goto("http://127.0.0.1:4173/support-resistance-room.html",{waitUntil:"networkidle"});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:"networkidle"});
            for (const title of ["Read structure before drawing","Identify meaningful swing points","Zones, not perfect lines","Choose the right areas and reduce clutter"]) {
              await page.locator("#sr-next-button").click();
              await page.waitForFunction(t=>document.querySelector("#sr-lesson-title").textContent.includes(t),title);
            }
            await page.waitForFunction(()=>{const i=document.querySelector("#sr-chart-image");return i&&i.complete&&i.naturalWidth>0&&i.getAttribute("src").endsWith("L05-A-01-overmarked.png")});
            await runA11yScan(page, "LESSON5_INITIAL");
            assert.equal(await page.locator("#sr-chart-stage-count").textContent(),"View 1 of 6");
            assert.equal(await page.locator("#sr-chart-next").isDisabled(),true,"Initial clutter view requires a learner attempt");
            await page.locator("#sr-practice-response").fill("The chart has a broad path with a lower reaction region and a later upper reaction; not every candidate mark adds information.");
            await page.locator("#sr-chart-next").click();
            await page.waitForFunction(()=>document.querySelector("#sr-chart-image").getAttribute("src").endsWith("L05-A-02-candidate-ids.png"));
            await runA11yScan(page, "LESSON5_CLASSIFICATION");
            assert.equal(await page.locator(".sr-room-edit-select").count(),7);
            assert.equal(await page.locator("#sr-chart-next").isDisabled(),true,"Candidates must be classified and submitted before reveals");
            const classifications=["keep","combine","combine","leave","combine","combine","leave"];
            for(let i=0;i<classifications.length;i++) await page.locator(".sr-room-edit-select").nth(i).selectOption(classifications[i]);
            await page.locator("#sr-teaching-editing-rationale").fill("I kept the major upper and lower areas, combined nearby marks, and left out a minor fluctuation and the distant band for this question.");
            assert.equal(await page.locator("#sr-teaching-editing-submit").isDisabled(),false);
            await page.locator("#sr-teaching-editing-submit").click();
            assert.equal(await page.locator("#sr-teaching-editing-feedback").isVisible(),true);
            assert.equal(await page.locator("#sr-chart-next").isDisabled(),false);
            const laterViews=["L05-A-04-minor-removed.png","L05-A-05-nearby-combined.png","L05-A-03-reduced-reference.png"];
            for(const file of laterViews){await page.locator("#sr-chart-next").click();await page.waitForFunction(f=>document.querySelector("#sr-chart-image").getAttribute("src").endsWith(f),file);}
            await page.locator("#sr-chart-next").click();
            await page.waitForFunction(()=>!document.querySelector("#sr-chartlab-panel").hidden);
            const axeLabContext = await browser.newContext({viewport:{width:1280,height:950}});
            const axeLabPage = await axeLabContext.newPage();
            axeLabPage.on("pageerror", e => errors.push("axe ChartLab page: " + e.message));
            axeLabPage.on("response", r => { if (r.status() >= 400) bad.push("axe ChartLab HTTP " + r.status() + " " + r.url()); });
            await axeLabPage.goto("http://127.0.0.1:4173/chartlab/clear-w.html?embed=1", {waitUntil:"networkidle"});
            await runA11yScan(axeLabPage, "CLEAR_W_INITIAL");
            async function enterZone(upper, lower) {
              await axeLabPage.locator("#upperPrice").fill(String(upper));
              await axeLabPage.locator("#lowerPrice").fill(String(lower));
              await axeLabPage.locator("#applyNumericZone").click();
              await axeLabPage.locator("#submitZoneButton").click();
            }
            await enterZone(100.8, 98.8);
            await enterZone(106.2, 104.6);
            await axeLabPage.locator("#comparisonPair").waitFor({state:"visible"});
            await runA11yScan(axeLabPage, "CLEAR_W_COMPARISON");
            await axeLabPage.close();

            const lab=page.frameLocator("#sr-chartlab-frame");
            await lab.locator("#chartSvg").waitFor();
            assert.equal(await lab.locator(".study-picker").isVisible().catch(()=>true),false,"Embedded lab should only expose Clear W, not the other practice sets");
            assert.equal(await page.locator("#sr-complete-button").isDisabled(),true,"Lesson completion remains gated before the ChartLab is completed");
            assert.equal(await lab.locator("#comparisonPair").isVisible(),false,"Reference comparison must be hidden initially");
            assert.doesNotMatch(await lab.locator("body").innerText(), /(^|[^A-Za-z0-9])4H([^A-Za-z0-9]|$)/, "Synthetic teaching candles must not be labelled as a real timeframe");
            assert.equal(await lab.locator("#metricWidth").textContent(), "Both lows", "Comparison cards name the evidence to inspect, not a score");
            assert.equal(await lab.locator("#metricOverlap").textContent(), "Neckline", "Comparison cards name the neckline evidence, not a percentage");

            // Draw support around both troughs. The chart's own SVG coordinate mapping is 1000×520.
            await lab.locator("#chartSvg").scrollIntoViewIfNeeded();
            let frameBox=await page.locator("#sr-chartlab-frame").boundingBox();
            let svgRect=await lab.locator("#chartSvg").evaluate(svg=>{const r=svg.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height}});
            const sx=frameBox.x+svgRect.left+svgRect.width*0.48;
            const sy=p=>frameBox.y+svgRect.top+((42+((114-p)/18)*(439-42))/520)*svgRect.height;
            await page.mouse.move(sx,sy(100.7));await page.mouse.down();
            await page.mouse.move(sx,sy(98.6),{steps:6});await page.mouse.up();
            assert.match(await lab.locator("#zoneReadout").textContent(),/Support: \d+\.\d–\d+\.\d/,"Support drag did not create a zone");
            await lab.locator("#submitZoneButton").click();
            await lab.getByText(/Support locked|support is marked/i).waitFor({timeout:5000}).catch(()=>{});
            assert.match(await lab.locator("#zoneReadout").textContent(),/Support: .*locked/);
            assert.equal(await lab.locator("#comparisonPair").isVisible(),false,"Reference stays hidden after support alone");

            // Draw the intervening neckline as a separate resistance zone.
            await lab.locator("#chartSvg").scrollIntoViewIfNeeded();
            frameBox=await page.locator("#sr-chartlab-frame").boundingBox();
            svgRect=await lab.locator("#chartSvg").evaluate(svg=>{const r=svg.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height}});
            const x2=frameBox.x+svgRect.left+svgRect.width*0.60;
            const y2=p=>frameBox.y+svgRect.top+((42+((114-p)/18)*(439-42))/520)*svgRect.height;
            await page.mouse.move(x2,y2(106.1));await page.mouse.down();
            await page.mouse.move(x2,y2(104.5),{steps:6});await page.mouse.up();
            assert.match(await lab.locator("#zoneReadout").textContent(),/Resistance: \d+\.\d–\d+\.\d/,"Resistance drag did not create a zone");
            await lab.locator("#submitZoneButton").click();
            await lab.locator("#comparisonPair").waitFor({state:"visible",timeout:5000});
            assert.match(await lab.locator("#feedbackText").textContent(), /does not score your reasoning/i, "Visual comparison must disclose that it does not grade the learner");
            assert.doesNotMatch(await lab.locator("#feedbackText").textContent(), /[0-9]+%/, "The visual feedback must not imply a precision/overlap score");
            assert.equal(await lab.locator("#studentCompareSvg [data-role='support']").count(),1);
            assert.equal(await lab.locator("#studentCompareSvg [data-role='resistance']").count(),1);
            assert.equal(await page.locator("#sr-complete-button").isDisabled(),true,"Two zones alone are not enough to complete the lesson");

            await lab.locator('input[name="reading1"][value="correct"]').check();
            await lab.locator('input[name="reading2"][value="break"]').check();
            await lab.locator("#checkUnderstanding").click();
            await lab.locator("#markCompleteButton").click();
            await page.waitForFunction(()=>document.querySelector("#sr-complete-button").disabled===false,{timeout:5000});
            assert.equal(await page.locator("#sr-complete-button").isDisabled(),false,"Lesson completion unlocks only after ChartLab completion is reported");
            await page.locator("#sr-complete-button").click();
            await page.waitForFunction(()=>document.querySelector("#sr-lesson-state").textContent.includes("COMPLETE"));

            // Mobile: both the course page and the embedded chart must fit the viewport without horizontal overflow.
            await page.setViewportSize({width:360,height:800});
            await page.waitForTimeout(500);
            const parentLayout=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth,labWidth:document.querySelector("#sr-chartlab-frame").getBoundingClientRect().width}));
            const childLayout=await lab.locator("body").evaluate(()=>({
              viewport:innerWidth,
              scroll:document.documentElement.scrollWidth,
              comparisonVisible:!document.querySelector("#comparisonPair").hidden,
              studentChartWidth:document.querySelector("#studentCompareSvg").getBoundingClientRect().width,
              answerChartWidth:document.querySelector("#answerCompareSvg").getBoundingClientRect().width
            }));
            assert.ok(parentLayout.scroll<=parentLayout.viewport+1,"Parent page overflows on mobile: "+JSON.stringify(parentLayout));
            assert.ok(childLayout.scroll<=childLayout.viewport+1,"ChartLab overflows on mobile: "+JSON.stringify(childLayout));
            assert.ok(childLayout.comparisonVisible,"Submitted comparison is not visible on mobile: "+JSON.stringify(childLayout));
            assert.ok(childLayout.studentChartWidth>0,"Student comparison chart is hidden or has zero width: "+JSON.stringify(childLayout));
            assert.ok(childLayout.answerChartWidth>0,"Reference comparison chart is hidden or has zero width: "+JSON.stringify(childLayout));
            assert.ok(childLayout.studentChartWidth<=childLayout.viewport+1,"Student comparison chart exceeds viewport: "+JSON.stringify(childLayout));
            assert.ok(childLayout.answerChartWidth<=childLayout.viewport+1,"Reference comparison chart exceeds viewport: "+JSON.stringify(childLayout));
            assert.deepEqual(errors,[],"JavaScript errors: "+errors.join("; "));
            assert.deepEqual(bad,[],"HTTP errors: "+bad.join("; "));
            await page.screenshot({path:"module5-clear-w-mobile-qa.png",fullPage:true});
            // Keyboard smoke audit: roving-tabindex lesson tabs and pointer-free two-zone input.
            const keyboardPage = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            keyboardPage.on("pageerror", e => errors.push("keyboard page: " + e.message));
            keyboardPage.on("response", r => { if (r.status() >= 400) bad.push("keyboard HTTP " + r.status() + " " + r.url()); });
            await keyboardPage.addInitScript(() => localStorage.clear());
            await keyboardPage.goto("http://127.0.0.1:4173/support-resistance-room.html");
            const lessonTab = keyboardPage.locator("#sr-tab-button-lesson");
            await lessonTab.waitFor();
            await lessonTab.focus();
            await keyboardPage.keyboard.press("ArrowRight");
            assert.equal(await keyboardPage.evaluate(() => document.activeElement.id), "sr-tab-button-notes", "ArrowRight moves focus to Notes");
            assert.equal(await keyboardPage.locator("#sr-tab-notes").isVisible(), true, "ArrowRight selects Notes panel");
            await keyboardPage.keyboard.press("ArrowRight");
            assert.equal(await keyboardPage.evaluate(() => document.activeElement.id), "sr-tab-button-check", "ArrowRight moves focus to Knowledge check");
            await keyboardPage.keyboard.press("End");
            assert.equal(await keyboardPage.evaluate(() => document.activeElement.id), "sr-tab-button-check", "End moves focus to the final tab");
            await keyboardPage.keyboard.press("Home");
            assert.equal(await keyboardPage.evaluate(() => document.activeElement.id), "sr-tab-button-lesson", "Home returns focus to Learn and practise");

            // Learner-language smoke check: first observe the candle lows, then define the terms.
            const l4Link = keyboardPage.locator('#sr-lesson-list [data-lesson-id="4"]');
            await l4Link.focus();
            await keyboardPage.keyboard.press("Enter");
            assert.match(await keyboardPage.locator("#sr-lesson-title").textContent(), /Zones, not perfect lines/);
            assert.match(await keyboardPage.locator("#sr-practice-instructions").textContent(), /lowest price each candle reached/i, "Opening prompt uses observable language before candle terminology");
            assert.doesNotMatch(await keyboardPage.locator("#sr-teaching-body").textContent(), /thin line extending beyond a candle body/i, "The initial observation view does not define the terms in advance");
            await keyboardPage.locator("#sr-practice-response").fill("The three lowest points differ a little, so one exact price would not describe every reaction.");
            await keyboardPage.locator("#sr-chart-next").focus();
            assert.equal(await keyboardPage.locator("#sr-chart-next").isDisabled(), false, "A written observation unlocks the next view");
            await keyboardPage.keyboard.press("Enter");
            assert.equal(await keyboardPage.locator("#sr-chart-stage-count").textContent(), "View 2 of 11", "The terminology appears on the next view, after observation");
            assert.match(await keyboardPage.locator("#sr-teaching-body").textContent(), /thin line extending beyond a candle body/i, "The second view defines wick, body and close");
            // Continue to the Lesson 3 keyboard selection test.
            const l3Link = keyboardPage.locator('#sr-lesson-list [data-lesson-id="3"]');
            await l3Link.focus();
            await keyboardPage.keyboard.press("Enter");
            assert.match(await keyboardPage.locator("#sr-lesson-title").textContent(), /Identify meaningful swing points/);
            await keyboardPage.locator("#sr-practice-response").focus();
            await keyboardPage.keyboard.type("I see a broad decline followed by a recovery.");
            await keyboardPage.locator("#sr-chart-next").focus();
            assert.equal(await keyboardPage.locator("#sr-chart-next").isDisabled(), false, "A first response unlocks the next lesson view");
            await keyboardPage.keyboard.press("Enter");
            await keyboardPage.locator("#sr-teaching-selection-panel").waitFor({state:"visible"});
            const firstCandidate=keyboardPage.locator('#sr-teaching-selection-options [data-point-id="C1"]');
            await keyboardPage.locator("#sr-chart-next").focus();
            await keyboardPage.keyboard.press("Tab");
            assert.equal(await keyboardPage.locator("#sr-practice-response").evaluate(el => el === document.activeElement), true, "Tab order enters the current-view response");
            await keyboardPage.keyboard.press("Tab");
            assert.equal(await keyboardPage.locator("#sr-attempt-made").evaluate(el => el === document.activeElement), true, "Tab order reaches the explicit attempt checkbox");
            await keyboardPage.keyboard.press("Tab");
            assert.equal(await firstCandidate.evaluate(el => el === document.activeElement), true, "Tab order reaches the candidate buttons");
            await keyboardPage.keyboard.press("Space");
            assert.equal(await firstCandidate.getAttribute("aria-pressed"), "true", "Space toggles a candidate button");
            for (let i=0;i<3;i++) {
              await keyboardPage.keyboard.press("Tab");
              await keyboardPage.keyboard.press("Space");
            }
            assert.equal(await keyboardPage.locator("#sr-teaching-selection-count").textContent(), "4 of 4 selected", "Candidate selection enforces the four-point practice limit");
            assert.equal(await keyboardPage.locator('#sr-teaching-selection-options [data-point-id="C5"]').isDisabled(), true, "Unselected candidate controls disable when the limit is reached");
            await keyboardPage.keyboard.press("Tab");
            assert.equal(await keyboardPage.locator("#sr-teaching-selection-note").evaluate(el => el === document.activeElement), true, "Tab skips disabled candidates and reaches the rationale");
            await keyboardPage.keyboard.type("These turns explain the broad decline and recovery.");
            await keyboardPage.locator("#sr-chart-next").focus();
            assert.equal(await keyboardPage.locator("#sr-chart-next").isDisabled(), false, "A rationale unlocks the next chart view");
            await keyboardPage.keyboard.press("Enter");

            const keyboardChartPage = await browser.newPage({ viewport: { width: 1024, height: 900 } });
            keyboardChartPage.on("pageerror", e => errors.push("keyboard ChartLab page: " + e.message));
            keyboardChartPage.on("response", r => { if (r.status() >= 400) bad.push("keyboard ChartLab HTTP " + r.status() + " " + r.url()); });
            await keyboardChartPage.addInitScript(() => localStorage.clear());
            await keyboardChartPage.goto("http://127.0.0.1:4173/chartlab/clear-w.html?embed=1");
            const keyLab = keyboardChartPage;
            await keyLab.locator("#upperPrice").waitFor({ state: "visible" });
            assert.equal(await keyLab.locator("#upperPrice").isDisabled(), false, "Upper edge field is available before pointer drawing");
            assert.equal(await keyLab.locator("#applyNumericZone").isVisible(), true, "Keyboard zone-creation action is initially visible");

            await keyLab.locator("#drawTool").focus();
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#upperPrice").evaluate(el => el === document.activeElement), true, "Tab reaches the numeric alternative after unavailable chart tools");
            await keyboardChartPage.keyboard.type("100.8");
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#lowerPrice").evaluate(el => el === document.activeElement), true, "Tab reaches the lower edge field");
            await keyboardChartPage.keyboard.type("98.8");
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#applyNumericZone").evaluate(el => el === document.activeElement), true, "Tab reaches Set zone from prices");
            await keyboardChartPage.keyboard.press("Enter");
            await keyLab.locator("#chartSvg [data-role='support']").waitFor({ state: "attached" });
            assert.equal(await keyLab.locator("#submitZoneButton").evaluate(el => el === document.activeElement), true, "Zone creation puts focus on Submit");
            await keyboardChartPage.keyboard.press("Enter");
            assert.match(await keyLab.locator("#statusText").textContent(), /Support is locked/i, "First submission locks support before resistance");

            // Return through normal keyboard navigation to the numeric fields for resistance.
            await keyboardChartPage.keyboard.press("Shift+Tab");
            assert.equal(await keyLab.locator("#applyNumericZone").evaluate(el => el === document.activeElement), true, "Tab returns to numeric-zone entry");
            await keyboardChartPage.keyboard.press("Shift+Tab");
            assert.equal(await keyLab.locator("#lowerPrice").evaluate(el => el === document.activeElement), true);
            await keyboardChartPage.keyboard.press("Shift+Tab");
            assert.equal(await keyLab.locator("#upperPrice").evaluate(el => el === document.activeElement), true);
            await keyboardChartPage.keyboard.type("106.2");
            await keyboardChartPage.keyboard.press("Tab");
            await keyboardChartPage.keyboard.press("Control+A");
            await keyboardChartPage.keyboard.type("104.6");
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#applyNumericZone").evaluate(el => el === document.activeElement), true);
            await keyboardChartPage.keyboard.press("Enter");
            await keyLab.locator("#chartSvg [data-role='resistance']").waitFor({ state: "attached" });
            assert.equal(await keyLab.locator("#submitZoneButton").evaluate(el => el === document.activeElement), true);
            await keyboardChartPage.keyboard.press("Enter");
            assert.equal(await keyLab.locator("#comparisonPair").isVisible(), true, "Comparison appears after the second keyboard submission");
            assert.equal(await keyLab.locator("#reflection").evaluate(el => el === document.activeElement), true, "Focus moves to the revealed comparison, not a hidden button");

            // Keyboard-only completion of the two short knowledge checks.
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator('input[name="reading1"][value="correct"]').evaluate(el => el === document.activeElement), true, "Tab enters the first quiz group");
            await keyboardChartPage.keyboard.press("Space");
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator('input[name="reading2"][value="continue"]').evaluate(el => el === document.activeElement), true, "Tab enters the second quiz group");
            await keyboardChartPage.keyboard.press("ArrowDown");
            assert.equal(await keyLab.locator('input[name="reading2"][value="break"]').isChecked(), true, "ArrowDown selects the valid second response");
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#printButton").evaluate(el => el === document.activeElement), true, "Tab reaches Print comparison");
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#checkUnderstanding").evaluate(el => el === document.activeElement), true, "Tab reaches Check my understanding");
            await keyboardChartPage.keyboard.press("Enter");
            await keyLab.locator("#markCompleteButton").waitFor({ state: "visible" });
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#finishPrintButton").evaluate(el => el === document.activeElement), true);
            await keyboardChartPage.keyboard.press("Tab");
            assert.equal(await keyLab.locator("#markCompleteButton").evaluate(el => el === document.activeElement), true, "Keyboard reaches Mark complete after both checks");
            await keyboardChartPage.keyboard.press("Enter");
            assert.match(await keyLab.locator("#markCompleteButton").textContent(), /Completed/i, "Keyboard can complete the activity");
            console.log("KEYBOARD_SMOKE_PASS: lesson-tab arrows, numeric zone creation, lock order, comparison focus, quiz and completion.");

            await keyboardPage.close();
            await keyboardChartPage.close();
            assert.deepEqual(errors, [], "JavaScript errors across all parent and keyboard test pages: " + errors.join("; "));
            assert.deepEqual(bad, [], "HTTP errors across all parent and keyboard test pages: " + bad.join("; "));
            console.log(JSON.stringify({result:"PASS",lesson5Views:6,candidateClasses:7,gate:"support → resistance → compare → two checks → lesson completion",mobile:{parentLayout,childLayout}},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
