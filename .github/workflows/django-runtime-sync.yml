name: One-time Django runtime sync

on:
  push:
    branches:
      - my-new-branch
    paths:
      - ".github/workflows/django-runtime-sync.yml"

permissions:
  contents: write

concurrency:
  group: tradethesis-django-runtime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v4
        with:
          ref: my-new-branch
          fetch-depth: 0

      - name: Copy Django runtime from the approved source branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/tradethesis-django"
          git clone --depth 1 --single-branch --branch feature/tradethesis-academy https://github.com/ZaphodBeeblebrox12/test.git "$SOURCE_DIR"
          SOURCE_SHA="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          mkdir -p backend
          for path in apps config integrations services static tasks templates tests utils docs data; do
            if [[ -d "$SOURCE_DIR/$path" ]]; then
              cp -a "$SOURCE_DIR/$path" backend/
            fi
          done
          for path in .env.example .gitignore .python-version DEPLOY.md Dockerfile Makefile README.md REFACTOR_NOTES.md docker-compose.yml manage.py pyproject.toml pytest.ini requirements.txt build.sh; do
            if [[ -f "$SOURCE_DIR/$path" ]]; then
              cp "$SOURCE_DIR/$path" "backend/$path"
            fi
          done
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f backend/db.sqlite3 backend/db.sqlite3-journal backend/ngrok.exe

          printf '%s\n' \
            '# Django runtime consolidation' \
            '' \
            'Target: ZaphodBeeblebrox12/prototypeweb, branch my-new-branch, directory backend/.' \
            "Source: ZaphodBeeblebrox12/test, feature/tradethesis-academy, commit $SOURCE_SHA." \
            'The original source repository and source branch remain unchanged as the rollback reference.' \
            'The website, course-content, and course-source directories remain at the repository root.' \
            'No local database, environment secrets, generated bytecode, temporary patch artifacts, one-off live test scripts, or source Render Blueprint were copied.' \
            'No Render configuration was changed and no Render deployment was triggered.' \
            > backend/CONSOLIDATION_HANDOFF.md

      - name: Verify the consolidated Django runtime
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install ruff black mypy django-stubs pytest pytest-cov pytest-django
          ruff check apps/academy/ tests/academy/
          black --check apps/academy/ tests/academy/ || echo "::warning::Black check is advisory, consistent with the source CI configuration."
          mypy apps/academy/ || echo "::warning::Mypy check is advisory, consistent with the source CI configuration."
          pytest tests/academy/test_course_import_workflow.py
          pytest --cov=apps --cov=integrations --cov-report=xml

      - name: Commit consolidation to my-new-branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm -f .github/workflows/consolidate-django-runtime.yml .github/workflows/django-runtime-sync.yml
          git add backend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Consolidate Django runtime under backend on my-new-branch"
          git push origin HEAD:my-new-branch
          {
            echo "## Django runtime consolidation"
            echo ""
            echo "- Source: test/feature/tradethesis-academy at $SOURCE_SHA"
            echo "- Target: prototypeweb/my-new-branch"
            echo "- Runtime copied to backend/"
            echo "- Focused Academy and full tests completed before commit."
            echo "- Render configuration and deployments were not touched."
          } >> "$GITHUB_STEP_SUMMARY"
