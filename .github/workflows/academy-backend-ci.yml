name: Academy backend CI

on:
  push:
    branches: [my-new-branch]
    paths:
      - "backend/**"
      - ".github/workflows/academy-backend-ci.yml"
  pull_request:
    branches: [my-new-branch, main]
    paths:
      - "backend/**"
      - ".github/workflows/academy-backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install ruff black pytest pytest-cov pytest-django "django-stubs[compatible-mypy]==5.0.0" "types-bleach==6.3.0.20251029" "types-Markdown==3.10.2.20260518"

      - name: Validate Render build script syntax
        run: bash -n build.sh

      - name: Set up Node for the isolated Tiptap editor
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Build the self-hosted Tiptap pilot bundle
        run: |
          npm install --prefix tools/course-builder-tiptap --no-audit --no-fund
          npm run build --prefix tools/course-builder-tiptap
          test -s static/academy/tiptap-pilot.js
          node --check static/academy/tiptap-pilot.js

      - name: Check Django migration state
        run: python manage.py makemigrations --check --dry-run

      - name: Run linting with ruff
        run: ruff check apps/academy/ tests/academy/


      - name: Check formatting with black
        continue-on-error: true
        run: black --check apps/academy/ tests/academy/

      - name: Show formatting diff for new Tiptap pilot view
        if: always()
        run: black --diff apps/academy/tiptap_pilot.py || true

      - name: Run type checking with mypy
        run: mypy apps/academy/ --follow-imports=silent

      - name: Collect static assets for test environment
        run: python manage.py collectstatic --noinput

      - name: Run focused micro-course image-slot regressions
        run: pytest tests/academy/test_course_import_workflow.py

      - name: Run full test suite
        run: pytest --cov=apps --cov=integrations --cov-report=xml
