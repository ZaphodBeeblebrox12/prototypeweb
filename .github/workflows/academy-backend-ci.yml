name: Academy backend CI

on:
  push:
    branches: [my-new-branch]
    paths:
      - "backend/**"
      - ".github/workflows/academy-backend-ci.yml"
  pull_request:
    branches: [my-new-branch]
    paths:
      - "backend/**"
      - ".github/workflows/academy-backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install ruff black mypy django-stubs pytest pytest-cov pytest-django

      # Temporary non-blocking diagnostic: expose the exact model/migration drift
      # reported by Render before creating corrective migration files.
      - name: Diagnose model migration drift
        continue-on-error: true
        run: python manage.py makemigrations --check --dry-run --verbosity 3

      - name: Run linting with ruff
        run: ruff check apps/academy/ tests/academy/

      - name: Check formatting with black
        continue-on-error: true
        run: black --check apps/academy/ tests/academy/

      - name: Run type checking with mypy
        continue-on-error: true
        run: mypy apps/academy/

      - name: Run focused micro-course image-slot regressions
        run: pytest tests/academy/test_course_import_workflow.py

      - name: Run full test suite
        run: pytest --cov=apps --cov=integrations --cov-report=xml
