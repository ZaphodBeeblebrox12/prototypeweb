name: Verify Support and Resistance learning room

on:
  push:
    branches:
      - my-new-branch
    paths:
      - "site/**"
      - "course-content/support-resistance/chart_assets/charts/**"
      - ".github/workflows/verify-learning-room.yml"
  pull_request:
    branches:
      - my-new-branch
      - main
    paths:
      - "site/**"
      - "course-content/support-resistance/chart_assets/charts/**"
      - ".github/workflows/verify-learning-room.yml"

permissions:
  contents: read

concurrency:
  group: learning-room-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Generate native-dimension image inventory
        run: python review/build_image_asset_inventory.py --output review/IMAGE_ASSET_INVENTORY.generated.csv

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check V5.2 integration script syntax
        run: node --check site/assets/support-resistance-room-v5_2-integration.js

      - name: Check image inspector and smoke test syntax
        run: |
          node --check site/assets/image-inspector.js
          node --check site/tests/image-inspector-smoke.cjs

      - name: Check member pages stay on the light theme
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("site/member-access.html", "site/member-area-preview.html"):
              page = Path(name).read_text(encoding="utf-8")
              if "color-scheme: light;" not in page:
                  raise SystemExit(f"{name} must explicitly use the light color scheme")
              if "light-dark(" in page:
                  raise SystemExit(f"{name} must not retain alternate dark-theme color tokens")
          print("Member access and the sample dashboard preview both use explicit light-theme colors.")
          PY

      - name: Verify dashboard links preserve signed-in sessions across public pages
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          target = "https://tradethesis-academy-staging.onrender.com/accounts/member-entry/"
          pages = (
              "site/index.html",
              "site/courses.html",
              "site/community.html",
              "site/live-class.html",
              "site/construct.html",
              "site/trading-path.html",
              "site/support-resistance-room.html",
              "site/member-access.html",
              "site/member-area-preview.html",
          )
          for name in pages:
              html = Path(name).read_text(encoding="utf-8")
              links = re.findall(
                  r'<a\b[^>]*>\s*Open member dashboard ↗\s*</a>',
                  html,
                  flags=re.IGNORECASE,
              )
              if len(links) != 2:
                  raise SystemExit(f"{name}: expected desktop and mobile dashboard links, found {len(links)}")
              stale = [link for link in links if f'href="{target}"' not in link]
              if stale:
                  raise SystemExit(f"{name}: dashboard link bypasses session-aware member entry")
          print("All public desktop/mobile dashboard links use the session-aware member-entry route.")
          PY

      - name: Install Playwright
        run: |
          mkdir -p /tmp/tt-playwright
          npm install --prefix /tmp/tt-playwright --no-save --no-audit --no-fund playwright
          /tmp/tt-playwright/node_modules/.bin/playwright install chromium --with-deps

      - name: Stage chart images for local browser tests
        run: |
          python - <<'PY'
          import re
          import shutil
          from pathlib import Path
          source = Path("course-content/support-resistance/chart_assets/charts")
          app = Path("site/assets/support-resistance-room.js").read_text(encoding="utf-8")
          names = sorted(set(re.findall(r"""["']([A-Za-z0-9_-]+\.png)["']""", app)))
          names = [name for name in names if name.startswith(("L", "CL"))]
          missing = [name for name in names if not (source / name).is_file()]
          if missing:
              raise SystemExit("Missing learning-room chart assets: " + ", ".join(missing))
          target = Path("site/assets/support-resistance-charts")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)
          vector_count = 0
          for name in names:
              shutil.copy2(source / name, target / name)
              vector_name = Path(name).with_suffix(".svg").name
              if (source / vector_name).is_file():
                  shutil.copy2(source / vector_name, target / vector_name)
                  vector_count += 1
          print(f"Staged {len(names)} lesson PNGs and {vector_count} SVG variants for browser smoke testing.")
          PY

      - name: Run lesson interaction smoke tests
        run: |
          cat > /tmp/learning-room-smoke.cjs <<'JS'
          const assert = require("node:assert/strict");
          const { chromium } = require("/tmp/tt-playwright/node_modules/playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();
            const pageErrors = [];
            const badResponses = [];
            const consoleErrors = [];
            const failedRequests = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            page.on("console", message => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("requestfailed", request => failedRequests.push({ url: request.url(), error: request.failure()?.errorText || "unknown" }));
            page.on("response", response => {
              if (response.status() >= 400 && !response.url().includes("favicon")) {
                badResponses.push({ status: response.status(), url: response.url() });
              }
            });

            const server = "http://127.0.0.1:4173";
            await page.goto(server + "/support-resistance-room.html", { waitUntil: "networkidle" });
            await page.waitForSelector("#sr-lesson-title");

            async function openLesson(id, expectedTitle) {
              await page.locator("#sr-tab-button-lesson").click();
              await page.locator('[data-lesson-id="' + id + '"]').click();
              await page.waitForFunction(({ id, expectedTitle }) => {
                const title = document.querySelector("#sr-lesson-title");
                return title && title.textContent === expectedTitle;
              }, { id, expectedTitle });
              await page.waitForFunction(() => {
                const image = document.querySelector("#sr-chart-image");
                return image && image.complete && image.naturalWidth > 0;
              });
              console.log("OPENED_LESSON_" + id + ": " + expectedTitle);
            }

            async function advanceWithResponse() {
              const previous = await page.locator("#sr-chart-stage-count").innerText();
              await page.locator("#sr-practice-response").fill(
                "I am recording the visible evidence, a plausible interpretation, and what would change my view."
              );
              await page.waitForFunction(() => !document.querySelector("#sr-chart-next").disabled);
              await page.locator("#sr-chart-next").click();
              await page.waitForFunction(previous => {
                return document.querySelector("#sr-chart-stage-count").innerText !== previous;
              }, previous);
              await page.waitForFunction(() => {
                const image = document.querySelector("#sr-chart-image");
                return image && image.complete && image.naturalWidth > 0;
              });
            }

            async function completeQuiz() {
              await page.locator("#sr-tab-button-check").click();
              const count = await page.locator(".sr-room-quiz-item").count();
              assert.ok(count > 0, "Expected lesson-specific knowledge-check items");
              for (let i = 0; i < count; i++) {
                await page.locator(".sr-room-quiz-item").nth(i).locator(".sr-room-quiz-option").first().click();
                await page.locator(".sr-room-quiz-item").nth(i).locator(".sr-room-quiz-submit").click();
              }
              await page.locator("#sr-tab-button-lesson").click();
              return count;
            }

            async function submitZoneTask({ values, rationale, submitText }) {
              const fields = page.locator(".sr-room-zone-task input");
              assert.equal(await fields.count(), values.length, "Unexpected number of structured boundary fields");
              for (let i = 0; i < values.length; i++) await fields.nth(i).fill(String(values[i]));
              await page.locator(".sr-room-zone-task textarea").fill(rationale);
              const submit = page.getByRole("button", { name: submitText, exact: true });
              await page.waitForFunction(() => {
                const button = document.querySelector(".sr-room-zone-task button");
                return button && !button.disabled;
              });
              await submit.click();
              await page.waitForFunction(() => {
                return document.querySelector(".sr-room-zone-task .sr-room-zone-status").textContent.toLowerCase().includes("submitted");
              });
            }

            // Lesson 6: stage navigation, numeric boundary submission, reference gate and completion gate.
            await openLesson(6, "Set defensible zone boundaries");
            for (let i = 0; i < 6; i++) await advanceWithResponse();
            await submitZoneTask({
              values: [100, 110],
              rationale: "The band captures the related lower reactions while keeping the unrelated candles outside.",
              submitText: "Submit boundary"
            });
            await page.locator("#sr-chart-next").click();
            await page.waitForFunction(() => document.querySelector("#sr-chart-stage-status").textContent.includes("Worked answer"));
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), true, "Lesson 6 must stay incomplete until its knowledge checks are submitted");
            const l6Checks = await completeQuiz();
            assert.equal(l6Checks, 3);
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), false, "Lesson 6 completion should unlock after activity and checks");

            // Lesson 7: each candidate must be classified and rationale submitted before the first reveal.
            await openLesson(7, "Keep the chart readable");
            assert.equal(await page.locator(".sr-room-edit-select").count(), 6);
            const choices = ["keep", "combine", "combine", "leave-out", "keep", "leave-out"];
            for (let i = 0; i < choices.length; i++) await page.locator(".sr-room-edit-select").nth(i).selectOption(choices[i]);
            await page.locator("#sr-teaching-editing-rationale").fill("B and C repeat the same broad region; D is minor for this question, while A and E explain the main structure.");
            await page.locator("#sr-teaching-editing-submit").click();
            await page.waitForFunction(() => !document.querySelector("#sr-chart-next").disabled);
            await page.locator("#sr-chart-next").click();
            await page.waitForFunction(() => document.querySelector("#sr-chart-stage-count").innerText === "View 2 of 6");
            assert.equal((await page.locator("#sr-room-top").innerText()).includes("Expanded lesson previews are now wired"), true);

            // Lesson 8: qualitative review, four-boundary submission and gated reference.
            await openLesson(8, "Evaluate a zone without inventing a magic score");
            for (let i = 0; i < 4; i++) await advanceWithResponse();
            assert.ok(await page.locator(".sr-room-teaching-figure img").evaluate(img => img.complete && img.naturalWidth > 0));
            await submitZoneTask({
              values: [100, 110, 130, 140],
              rationale: "Support captures both lower reactions. Resistance is a separate upper reaction area; neither band needs to predict the next move.",
              submitText: "Submit zones before reference"
            });
            await page.locator("#sr-chart-next").click();
            await page.waitForFunction(() => document.querySelector("#sr-chart-stage-count").innerText === "View 6 of 8");
            assert.equal((await completeQuiz()), 3);
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), false, "Lesson 8 completion should unlock after lab submission and checks");

            // Lesson 12: the four evidence stages must be recorded; all seven checks then unlock completion.
            await openLesson(12, "Breakout or temporary penetration?");
            for (let i = 0; i < 4; i++) await advanceWithResponse();
            assert.equal((await page.locator(".sr-room-quiz-item").count()), 7);
            assert.ok(await page.locator(".sr-room-teaching-figure img").evaluate(img => img.complete && img.naturalWidth > 0));
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), true, "Lesson 12 completion must await knowledge-check submissions");
            assert.equal(await completeQuiz(), 7);
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), false);

            // Lesson 13: compare hold and failed return; all seven checks gate completion.
            await openLesson(13, "Retests and role reversal");
            for (let i = 0; i < 3; i++) await advanceWithResponse();
            assert.equal(await page.locator(".sr-room-quiz-item").count(), 7);
            assert.equal(await completeQuiz(), 7);
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), false);

            // Lesson 14: initial thesis, contradiction, contrasting hold, Wider Neckline submission and eight checks.
            await openLesson(14, "Failed breakouts and alternate outcomes");
            for (let i = 0; i < 4; i++) await advanceWithResponse();
            assert.ok(await page.locator(".sr-room-teaching-figure img").evaluate(img => img.complete && img.naturalWidth > 0));
            await submitZoneTask({
              values: [100, 110, 130, 140],
              rationale: "Support groups the two lower reactions. The neckline frames the upper reaction; price may hold above it or return below it.",
              submitText: "Submit Wider Neckline zones"
            });
            await page.locator("#sr-chart-next").click();
            await page.waitForFunction(() => document.querySelector("#sr-chart-stage-count").innerText === "View 6 of 8");
            assert.equal(await page.locator(".sr-room-quiz-item").count(), 8);
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), true);
            assert.equal(await completeQuiz(), 8);
            assert.equal(await page.locator("#sr-complete-button").isDisabled(), false);

            // Integrated V5.2 lesson material must be available in the regular Learning Room.
            await page.evaluate(() => localStorage.clear());
            for (const check of [
              { id: 12, sections: 15, terms: ["The evidence ladder: wick, close, acceptance, follow-through", "Volume: useful context, not a verdict", "The note should preserve the rule you actually used"] },
              { id: 13, sections: 10, terms: ["The depth of the return matters", "Three responses that share the same name", "Some breakouts never retest the zone", "Role reversal is possible, not automatic"] },
              { id: 14, sections: 18, terms: ["Range-edge upthrust or false upside break", "Trendline penetration and reclaim", "The first pullback holds; a later pullback fails", "Process and outcome are not the same thing"] }
            ]) {
              await page.goto(server + "/support-resistance-room.html?lesson=" + check.id, { waitUntil: "networkidle" });
              await page.waitForSelector("#sr-v52-longform:not([hidden])");
              await page.waitForFunction(id => document.querySelector("#sr-lesson-number").textContent.includes(String(id).padStart(2, "0")), check.id);
              const panel = page.locator("#sr-v52-longform");
              assert.equal(await panel.locator(".sr-v52-section").count(), check.sections, "Unexpected V5.2 section count for Lesson " + check.id);
              const lessonText = await panel.innerText();
              for (const term of check.terms) assert.ok(lessonText.includes(term), "Lesson " + check.id + " is missing: " + term);
              assert.ok(await panel.locator(".sr-v52-figure img").count() > 0, "Schematic teaching figures are missing for Lesson " + check.id);
              assert.equal(await panel.locator(".sr-v52-case-study").count(), 1, "Text-only case-study card is missing");
              assert.equal(await panel.locator(".sr-v52-case-study img").count(), 0, "Historical chart images must remain withheld");
              assert.equal(await panel.locator(".sr-v52-note-prompt").count(), 4, "V5.2 field-note prompts must be available");
              assert.ok(await panel.locator("#sr-v52-final-review li").count() > 0, "The V5.2 self-check rubric is missing");
              assert.equal(await panel.locator("#sr-v52-final-review").evaluate(el => el.hidden), true, "The final review must stay concealed before a final-view attempt");
            }

            // Lesson notes and the existing synthetic staged chart remain in the same room.
            await page.evaluate(() => localStorage.clear());
            await page.goto(server + "/support-resistance-room.html?lesson=13", { waitUntil: "networkidle" });
            await page.waitForSelector("#sr-v52-longform:not([hidden])");
            await page.locator("#sr-v52-longform [data-sr-v52-jump='notes']").click();
            await page.waitForFunction(() => document.querySelector("#sr-tab-notes") && !document.querySelector("#sr-tab-notes").hidden);
            assert.ok((await page.locator("#sr-lesson-notes").getAttribute("placeholder")).length > 20, "Lesson-specific note prompts were not connected to My notes");
            await page.locator("#sr-tab-button-lesson").click();
            await page.locator("#sr-v52-longform [data-sr-v52-jump='chart']").first().click();
            assert.ok((await page.locator("#sr-chart-image").getAttribute("src")).includes("L13-A-01-break-beyond"), "The room should retain its synthetic Lesson 13 chart source");
            await page.locator("#sr-practice-response").fill("The break is visible, but the return and response remain unknown, so I retain an alternative.");
            await page.waitForSelector("#sr-v52-stage-model-answer:not([hidden])");
            assert.equal(await page.locator(".sr-v52-model-details[open]").count(), 0, "Model answer should be concealed until explicitly opened");
            await page.locator(".sr-v52-model-details > summary").click();
            assert.ok((await page.locator(".sr-v52-model-details").innerText()).length > 40, "The matching stage model answer is empty");
            for (const stageNumber of [2, 3, 4]) {
              await page.locator("#sr-practice-response").fill("I recorded the visible evidence, my interpretation, and what would change my view.");
              await page.locator("#sr-chart-next").click();
              await page.waitForFunction(n => document.querySelector("#sr-chart-stage-count").textContent.includes("View " + n + " of 4"), stageNumber);
              assert.equal(await page.locator("#sr-v52-stage-model-answer").evaluate(el => el.hidden), true, "An earlier chart response must not reveal this chart's model answer");
              if (stageNumber < 4) assert.equal(await page.locator("#sr-v52-final-review").evaluate(el => el.hidden), true, "The final review must wait for the last view");
            }
            await page.locator("#sr-practice-response").fill("I recorded the final view and what would weaken my interpretation.");
            await page.waitForFunction(() => !document.querySelector("#sr-v52-final-review").hidden);

            // Old reader links resolve into the same Learning Room; mobile content must not overflow.
            await page.goto(server + "/module5-v5_2/index.html?lesson=14", { waitUntil: "networkidle" });
            await page.waitForFunction(() => window.location.pathname.endsWith("/support-resistance-room.html") && new URLSearchParams(window.location.search).get("lesson") === "14");
            await page.waitForSelector("#sr-v52-longform:not([hidden])");
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(server + "/support-resistance-room.html?lesson=13", { waitUntil: "networkidle" });
            await page.waitForSelector("#sr-v52-longform:not([hidden])");
            const overflow = await page.evaluate(() => {
              const viewport = document.documentElement.clientWidth;
              const nodes = [document.documentElement, document.body, ...document.querySelectorAll("body *")];
              const offenders = nodes.map(el => {
                const rect = el.getBoundingClientRect();
                const style = getComputedStyle(el);
                return { tag: el.tagName, id: el.id, className: typeof el.className === "string" ? el.className.slice(0, 100) : "", left: Math.round(rect.left), right: Math.round(rect.right), width: Math.round(rect.width), clientWidth: el.clientWidth, scrollWidth: el.scrollWidth, overflowX: style.overflowX, display: style.display, position: style.position };
              }).filter(el => el.width > 0 && (el.right > viewport + 1 || el.left < -1 || el.scrollWidth > el.clientWidth + 1)).sort((a, b) => Math.max(b.right - viewport, b.scrollWidth - b.clientWidth) - Math.max(a.right - viewport, a.scrollWidth - a.clientWidth)).slice(0, 16);
              return { viewport, document: document.documentElement.scrollWidth, body: document.body.scrollWidth, offenders };
            });
            // The site deliberately clips a decorative header pseudo-element off-canvas; assert against document-level horizontal scrolling, not body.scrollWidth.
            assert.ok(overflow.document <= overflow.viewport + 1, "Mobile page has horizontal scrolling: " + JSON.stringify(overflow));
            console.log("INTEGRATED_V52_PASS: long-form lesson content, notes, concealed model responses, synthetic charts, legacy routing, and mobile overflow.");


            // Expanding catalogue regression: visible future courses add their own topic filters; hidden drafts stay out.
            const cataloguePage = await context.newPage();
            cataloguePage.on("pageerror", error => pageErrors.push(error.message));
            cataloguePage.on("console", message => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            cataloguePage.on("requestfailed", request => failedRequests.push({ url: request.url(), error: request.failure()?.errorText || "unknown" }));
            cataloguePage.on("response", response => {
              if (response.status() >= 400 && !response.url().includes("favicon")) {
                badResponses.push({ status: response.status(), url: response.url() });
              }
            });
            await cataloguePage.route("**/api/youtube/live-status/", async route => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                headers: { "access-control-allow-origin": "*" },
                body: JSON.stringify({ is_live: false, watch_url: "" })
              });
            });
            await cataloguePage.route("**/api/academy/catalogue/", async route => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                headers: { "access-control-allow-origin": "*" },
                body: JSON.stringify({ courses: [{
                  id: "ci-api-bollinger-bands",
                  slug: "bollinger-bands",
                  title: "Bollinger Bands",
                  category: "API fixture category",
                  level: "Intermediate",
                  description: "Browser test API course.",
                  outcome: "Browser test outcome.",
                  complements: "Browser fixture only.",
                  price: "",
                  status: "published",
                  catalogueRole: "mini",
                  catalogueOrder: 11,
                  art: "structure",
                  modules: [
                    { title: "First module", count: "1 lesson", preview: "First preview", points: ["First lesson"] },
                    { title: "Second module", count: "1 lesson", preview: "Second preview", points: ["Second lesson"] }
                  ],
                  academyUrl: "https://tradethesis-academy-staging.onrender.com/courses/bollinger-bands/"
                }, {
                  id: "ci-api-support-resistance",
                  slug: "support-resistance",
                  title: "Support & Resistance",
                  category: "API fixture category",
                  level: "Intermediate",
                  description: "Browser test API course with the default zero position.",
                  outcome: "Browser test outcome.",
                  complements: "Browser fixture only.",
                  price: "",
                  status: "published",
                  catalogueRole: "mini",
                  catalogueOrder: 0,
                  art: "structure",
                  // Empty modules preserve the curated multi-section outline for this matched course.
                  modules: [],
                  academyUrl: "https://tradethesis-academy-staging.onrender.com/courses/support-resistance/"
                }] })
              });
            });
            await cataloguePage.addInitScript(() => {
              // Exercise a production-origin override without making real external requests.
              window.TRADETHESIS_ACADEMY_BASE_URL = "https://academy.example.test";
              let catalogueData;
              Object.defineProperty(window, "TRADETHESIS_COURSE_DATA", {
                configurable: true,
                get() { return catalogueData; },
                set(value) {
                  value.microCourses.push({
                    id: "ci-future-visible-course",
                    catalogueVisibility: "visible",
                    priority: 3,
                    order: 990,
                    title: "Emerging Topic Preview",
                    category: "Emerging topic",
                    art: "structure",
                    price: "₹100",
                    level: "Browser test fixture",
                    description: "A test-only visible course proves the catalogue expands from data.",
                    outcome: "The new topic is present only for this browser test.",
                    complements: "Test fixture only.",
                    modules: [{ title: "Test section", count: "1 lesson", preview: "Preview text", points: ["Test point"] }]
                  });
                  value.microCourses.push({
                    id: "ci-future-hidden-draft",
                    catalogueVisibility: "hidden",
                    priority: 3,
                    order: 991,
                    title: "Hidden Draft Must Not Appear",
                    category: "Hidden draft topic",
                    art: "structure",
                    price: "₹1",
                    level: "Draft",
                    description: "This draft must not be rendered.",
                    outcome: "Hidden",
                    complements: "Hidden",
                    modules: []
                  });
                  catalogueData = value;
                }
              });
            });
            await cataloguePage.goto(server + "/courses.html", { waitUntil: "networkidle" });
            const academyBaseUrl = await cataloguePage.evaluate(() => window.TRADETHESIS_ACADEMY_CONFIG?.baseUrl || "");
            assert.equal(academyBaseUrl, "https://academy.example.test",
              "The public Academy origin should be overrideable for a different deployment");
            const memberEntryHref = await cataloguePage.locator(".member-area-link").getAttribute("href");
            assert.equal(new URL(memberEntryHref).origin, new URL(academyBaseUrl).origin,
              "The desktop member link should follow the configured Academy origin");
            const liveStatusUrl = await cataloguePage.locator("[data-youtube-live-control]").getAttribute("data-youtube-live-status-url");
            assert.equal(new URL(liveStatusUrl).origin, new URL(academyBaseUrl).origin,
              "The live-status endpoint should follow the configured Academy origin");
            try {
              await cataloguePage.waitForSelector("#cc-course-filters [data-filter='API fixture category']");
            const apiBackedStaticMicro = cataloguePage.locator('#cc-micro-grid article.ed-micro-tile:has([data-open-course="bollinger-bands"])');
            assert.equal(await apiBackedStaticMicro.locator(".ed-tile-art svg circle").count(), 0,
              "Generic Academy API fallback artwork must not replace the authored Bollinger Bands tile art");
            await cataloguePage.waitForSelector("#cc-micro-grid [data-open-course='ci-future-visible-course']", { timeout: 8000 });
            } catch (error) {
              const diagnostic = await cataloguePage.evaluate(() => {
                const data = window.TRADETHESIS_COURSE_DATA;
                const grid = document.querySelector("#cc-micro-grid");
                return {
