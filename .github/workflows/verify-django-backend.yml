name: Verify Django Academy backend

on:
  push:
    branches:
      - feature/tradethesis-academy
    paths:
      - "backend/**"
      - ".github/workflows/verify-django-backend.yml"
  pull_request:
    branches:
      - my-new-branch
    paths:
      - "backend/**"
      - ".github/workflows/verify-django-backend.yml"

permissions:
  contents: read

concurrency:
  group: academy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:////tmp/tradethesis-tests.sqlite3
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      MAXMIND_ENABLED: "False"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-django ruff black mypy django-stubs

      - name: Check Django configuration and Python syntax
        run: |
          python manage.py check
          python -m compileall -q apps config

      - name: Lint Academy implementation
        run: ruff check apps/academy/ tests/academy/

      - name: Check Academy formatting
        continue-on-error: true
        run: black --check apps/academy/ tests/academy/

      - name: Type-check Academy implementation
        continue-on-error: true
        run: mypy apps/academy/

      - name: Run backend regression tests
        run: pytest --cov=apps --cov=integrations --cov-report=xml

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: backend/coverage.xml
          if-no-files-found: ignore
