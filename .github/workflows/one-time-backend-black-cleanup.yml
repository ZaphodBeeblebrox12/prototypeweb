name: One-time backend formatting cleanup

on:
  push:
    branches:
      - my-new-branch
    paths:
      - ".github/workflows/one-time-backend-black-cleanup.yml"

permissions:
  contents: write

jobs:
  format-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: my-new-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Black
        run: python -m pip install --disable-pip-version-check black

      - name: Format Academy backend and its test suites
        run: |
          black backend/apps/academy backend/tests/academy backend/apps/core/email_backends.py backend/tests/test_email_backends.py

      - name: Commit formatting-only changes to the working branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "All targeted Python files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/apps/academy backend/tests/academy backend/apps/core/email_backends.py backend/tests/test_email_backends.py
          git commit -m "Format Academy backend and tests with Black"
          git push origin HEAD:my-new-branch
