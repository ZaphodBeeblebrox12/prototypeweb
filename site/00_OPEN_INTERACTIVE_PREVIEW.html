<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeThesis — Integrated Course Preview</title><style>:root{--paper:#fbf7ef;--ink:#29382e;--muted:#687268;--green:#355a46;--line:#ded8ca}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}.studio{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbf7eff5;box-shadow:0 4px 14px #29382e08;position:relative;z-index:2;flex-wrap:wrap}.label{font:400 18px Georgia,serif;margin-right:10px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fffdf8;color:var(--muted);border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}.tabs button.active{background:var(--green);border-color:var(--green);color:white}.hint{margin-left:auto;font-size:11px;color:var(--muted)}iframe{border:0;width:100%;height:100%;background:var(--paper)}@media(max-width:620px){.top{align-items:flex-start}.label{width:100%}.hint{margin-left:0;width:100%}.tabs button{font-size:11px;padding:8px 10px}}</style></head><body><div class="studio"><div class="top"><div class="label">TradeThesis / Site review</div><div class="tabs" role="group" aria-label="Select preview page"><button data-page="index.html" class="active">Home</button><button data-page="courses.html">Courses</button><button data-page="trading-path.html">Trading Path</button><button data-page="construct.html">CONSTRUCT</button><button data-page="live-class.html">Live classroom</button><button data-page="community.html">Community</button><button data-page="support-resistance-room.html">Support &amp; Resistance room</button></div><span class="hint">Review build · checkout and enrolment are not connected</span></div><iframe id="preview" title="TradeThesis website preview" src="index.html"></iframe></div><script>const frame=document.getElementById('preview');document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>{frame.src=btn.dataset.page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b===btn))}));</script></body></html>
