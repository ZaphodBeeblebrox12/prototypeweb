<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="academy-base-url" content="https://tradethesis-academy-staging.onrender.com">
  <meta name="description" content="Secure TradeThesis member sign-in and registration.">
  <title>Opening your TradeThesis account…</title>
  <style>
    :root{color-scheme: light;--paper:#f7f3e9;--ink:#29382e;--muted:#687268;--green:#355a46}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{padding:30px;max-width:480px}h1{font:400 32px/1.1 Georgia,"Times New Roman",serif}p{color:var(--muted);font-size:14px;line-height:1.7}a{display:inline-flex;margin-top:12px;padding:12px 20px;border-radius:99px;background:var(--green);color:white;text-decoration:none;font-size:12px;font-weight:750}
  </style>
</head>
<body>
  <main>
    <h1>TradeThesis member desk</h1>
    <p>Opening your secure sign-in and account page…</p>
    <a id="continue" href="https://tradethesis-academy-staging.onrender.com/accounts/login/?next=%2Flearn%2F">Continue to sign in</a>
  </main>
  <script>
    (() => {
      const meta = document.querySelector('meta[name="academy-base-url"]');
      let base = (meta?.content || "https://tradethesis-academy-staging.onrender.com").trim();
      while (base.endsWith("/")) base = base.slice(0, -1);
      const requested = new URLSearchParams(window.location.search).get("next") || "/learn/";
      const next = requested.startsWith("/") && !requested.startsWith("//") ? requested : "/learn/";
      const destination = new URL("/accounts/login/", base);
      destination.searchParams.set("next", next);
      const link = document.getElementById("continue");
      link.href = destination.href;
      // Keep the bridge page visible when running the repository's local
      // browser smoke tests; hosted staging redirects straight to Django.
      if (["localhost", "127.0.0.1"].includes(window.location.hostname)) return;
      window.location.replace(destination.href);
    })();
  </script>
</body>
</html>
