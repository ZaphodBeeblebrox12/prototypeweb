<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open your secure TradeThesis member account.">
  <meta name="theme-color" content="#f7f3e9">
  <title>Member access | TradeThesis</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/tradethesis-icon.png">
  <link rel="stylesheet" href="assets/sitewide-nav.css">
  <style>
    :root { color-scheme: light; --paper:#f7f3e9; --surface:#fffdf8; --ink:#29382e; --muted:#687268; --line:#ded8ca; --green:#355a46; --tomato:#c96f50; --serif:Georgia,"Times New Roman",serif; --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    .bridge { width:min(520px,calc(100% - 32px)); margin:auto; padding:55px 0; text-align:center; }
    .eyebrow { color:var(--green); font-size:10px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:17px 0 10px; font:400 clamp(36px,8vw,54px)/1.05 var(--serif); letter-spacing:-.04em; }
    p { color:var(--muted); font-size:14px; line-height:1.75; }
    .status { margin:24px 0; padding:16px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:12px; line-height:1.6; }
    .continue { min-height:50px; display:flex; align-items:center; justify-content:center; padding:12px 20px; border:1px solid var(--green); border-radius:99px; background:var(--green); color:#fffdf8; font-size:13px; font-weight:800; }
    .continue[aria-disabled="true"] { opacity:.55; cursor:not-allowed; }
    .foot { padding:16px; border-top:1px solid var(--line); color:var(--muted); text-align:center; font-size:10px; }
    @media(max-width:480px) { .bridge { padding:35px 0; } }
  </style>
</head>
<body>
  <main class="bridge">
    <div class="eyebrow">TradeThesis / member desk</div>
    <h1>Your member space, in one place.</h1>
    <p>Sign in or create your account through the secure TradeThesis Academy authentication page.</p>
    <div class="status" id="memberAccessStatus" role="status" aria-live="polite">
      Opening secure member access…
    </div>
    <a class="continue" href="#" data-academy-path="/accounts/member-entry/">Continue to Member Area →</a>
  </main>
  <footer class="foot">TradeThesis · Conviction before execution</footer>
  <script src="assets/academy-config.js"></script>
  <script>
    (() => {
      const link = document.querySelector("[data-academy-path]");
      const status = document.getElementById("memberAccessStatus");
      if (link && link.href && link.getAttribute("aria-disabled") !== "true" && link.href !== window.location.href + "#") {
        window.location.replace(link.href);
        return;
      }
      status.textContent = "Member access is not configured for this website. Open the TradeThesis Academy site or contact support.";
      if (link) {
        link.textContent = "Member access unavailable";
        link.setAttribute("aria-disabled", "true");
      }
    })();
  </script>
</body>
</html>
