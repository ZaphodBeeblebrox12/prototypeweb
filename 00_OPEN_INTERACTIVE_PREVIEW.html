const frame=document.getElementById('sitePreview');
function decodePage(key){const bytes=Uint8Array.from(atob(PAGE_DATA[key].html),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
const routes={'index.html':'home','homepage-preview.html':'home','courses.html':'courses','trading-path.html':'course','foundations.html':'course','live-class.html':'live'};
let requestedHash='';
function goToPage(key,hash=''){if(!PAGE_DATA[key])return;document.title=PAGE_DATA[key].title+' · Preview v15';requestedHash=hash;frame.srcdoc=decodePage(key)}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;if(!doc)return;if(requestedHash){const id=decodeURIComponent(requestedHash.replace(/^#/,''));const target=doc.getElementById(id);if(target)target.scrollIntoView({behavior:'auto',block:'start'});requestedHash=''}doc.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const href=a.getAttribute('href')||'';if(!href||href.startsWith('mailto:')||href.startsWith('tel:')||/^https?:/i.test(href))return;if(href.startsWith('#')){e.preventDefault();const target=doc.getElementById(decodeURIComponent(href.slice(1)));if(target)target.scrollIntoView({behavior:'smooth',block:'start'});return}const parts=href.split('#');const file=parts[0].split('?')[0].split('/').pop();const key=routes[file];if(key){e.preventDefault();goToPage(key,parts[1]?'#'+parts.slice(1).join('#'):'')}else if(file.endsWith('.html')){e.preventDefault();goToPage('courses')}},true)}catch(err){console.warn('Preview routing issue',err)}});
goToPage('home');
