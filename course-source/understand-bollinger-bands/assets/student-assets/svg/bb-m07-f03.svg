<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>Review the process, not just the outcome</title><desc>Record conditions, rules, outcomes and what each case cannot establish. Original illustrative teaching diagram, not historical market data.</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbf7ef" stroke="none" /><text x="42" y="40" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#54795f">TRADETHESIS · LEARNING ROOM</text><text x="42" y="82" font-family="Georgia, serif" font-size="30" font-weight="700" text-anchor="start" fill="#26392f">Review the process, not just the outcome</text><text x="42" y="114" font-family="system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#667266">Record conditions, rules, outcomes and what each case cannot establish.</text><text x="1155" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#667266">MODULE 7 · RISK AND REVIEW</text><rect x="42" y="160" width="1116" height="390" rx="14" fill="#fffdf8" stroke="#e3e0d4" /><rect x="42" y="160" width="180" height="52" rx="0" fill="#f3ead5" stroke="#e1ddcf" /><text x="50" y="191" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#26392f">Context</text><rect x="222" y="160" width="190" height="52" rx="0" fill="#e9eee5" stroke="#e1ddcf" /><text x="230" y="191" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#26392f">Setup / trigger</text><rect x="412" y="160" width="175" height="52" rx="0" fill="#f3ead5" stroke="#e1ddcf" /><text x="420" y="191" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#26392f">Stop / exit rule</text><rect x="587" y="160" width="155" height="52" rx="0" fill="#e9eee5" stroke="#e1ddcf" /><text x="595" y="191" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#26392f">Outcome</text><rect x="742" y="160" width="185" height="52" rx="0" fill="#f3ead5" stroke="#e1ddcf" /><text x="750" y="191" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#26392f">Rule adherence</text><rect x="927" y="160" width="225" height="52" rx="0" fill="#e9eee5" stroke="#e1ddcf" /><text x="935" y="191" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#26392f">Limitation</text><rect x="42" y="212" width="180" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="50" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Trend</text><rect x="222" y="212" width="190" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="230" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Band walk</text><rect x="412" y="212" width="175" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="420" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Swing invalidation</text><rect x="587" y="212" width="155" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="595" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Win</text><rect x="742" y="212" width="185" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="750" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Followed</text><rect x="927" y="212" width="225" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="935" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">One case</text><rect x="42" y="288" width="180" height="76" rx="0" fill="#fffdf8" stroke="#e1ddcf" /><text x="50" y="318" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Range</text><rect x="222" y="288" width="190" height="76" rx="0" fill="#fffdf8" stroke="#e1ddcf" /><text x="230" y="318" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Band touch</text><rect x="412" y="288" width="175" height="76" rx="0" fill="#fffdf8" stroke="#e1ddcf" /><text x="420" y="318" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Range boundary</text><rect x="587" y="288" width="155" height="76" rx="0" fill="#fffdf8" stroke="#e1ddcf" /><text x="595" y="318" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Loss</text><rect x="742" y="288" width="185" height="76" rx="0" fill="#fffdf8" stroke="#e1ddcf" /><text x="750" y="318" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Followed</text><rect x="927" y="288" width="225" height="76" rx="0" fill="#fffdf8" stroke="#e1ddcf" /><text x="935" y="318" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Sample size</text><rect x="42" y="364" width="180" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="50" y="394" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Failed break</text><rect x="222" y="364" width="190" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="230" y="394" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Re-entry</text><rect x="412" y="364" width="175" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="420" y="394" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Original premise</text><rect x="587" y="364" width="155" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="595" y="394" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Mixed</text><rect x="742" y="364" width="185" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="750" y="394" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">Reviewed</text><rect x="927" y="364" width="225" height="76" rx="0" fill="#fcfaf4" stroke="#e1ddcf" /><text x="935" y="394" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#26392f">No reverse rule</text><text x="58" y="607" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#c96f50">A few examples improve review discipline; they cannot establish profitability.</text><line x1="335" y1="680" x2="365" y2="680" stroke="#c96f50" stroke-width="2" stroke-dasharray="5 4" /><text x="374" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Upper band</text><line x1="490" y1="680" x2="520" y2="680" stroke="#c2a15a" stroke-width="2" stroke-dasharray="3 4" /><text x="529" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Middle line</text><line x1="645" y1="680" x2="675" y2="680" stroke="#8da88f" stroke-width="2" stroke-dasharray="5 4" /><text x="684" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Lower band</text><line x1="800" y1="680" x2="830" y2="680" stroke="#26392f" stroke-width="2" /><text x="839" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Price</text></svg>