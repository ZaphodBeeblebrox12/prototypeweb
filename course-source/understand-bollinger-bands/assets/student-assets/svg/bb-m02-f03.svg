<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>Where price sits between the bands</title><desc>%B describes price position relative to the band envelope. Original illustrative conceptual diagram; not historical market data.</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbf7ef" stroke="none" /><text x="42" y="40" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#54795f">TRADETHESIS · LEARNING ROOM</text><text x="42" y="82" font-family="Georgia, serif" font-size="30" font-weight="700" text-anchor="start" fill="#26392f">Where price sits between the bands</text><text x="42" y="114" font-family="system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#667266">%B describes price position relative to the band envelope.</text><text x="1155" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#667266">MODULE 2 · READ THE BANDS</text><rect x="45" y="150" width="1110" height="460" rx="16" fill="#fffdf8" stroke="#e3e0d4" /><text x="80" y="205" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#26392f">%B describes where price is within or beyond the envelope</text><line x1="120" y1="355" x2="1080" y2="355" stroke="#26392f" stroke-width="3" /><line x1="120" y1="342" x2="120" y2="368" stroke="#26392f" stroke-width="2" /><text x="120" y="325" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26392f">Below 0</text><text x="120" y="397" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#667266">Below lower band</text><line x1="360" y1="342" x2="360" y2="368" stroke="#26392f" stroke-width="2" /><text x="360" y="325" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26392f">0</text><text x="360" y="397" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#667266">Lower band</text><line x1="600" y1="342" x2="600" y2="368" stroke="#26392f" stroke-width="2" /><text x="600" y="325" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26392f">0.5</text><text x="600" y="397" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#667266">Middle line</text><line x1="840" y1="342" x2="840" y2="368" stroke="#26392f" stroke-width="2" /><text x="840" y="325" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26392f">1</text><text x="840" y="397" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#667266">Upper band</text><line x1="1080" y1="342" x2="1080" y2="368" stroke="#26392f" stroke-width="2" /><text x="1080" y="325" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#26392f">Above 1</text><text x="1080" y="397" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#667266">Above upper band</text><rect x="150" y="465" width="300" height="65" rx="10" fill="#f6e5dc" stroke="#e5b5a1" /><text x="300" y="493" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#26392f">Below the lower band</text><text x="300" y="515" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#667266">%B &lt; 0</text><rect x="750" y="465" width="300" height="65" rx="10" fill="#e9eee5" stroke="#b7cbb9" /><text x="900" y="493" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#26392f">Above the upper band</text><text x="900" y="515" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#667266">%B &gt; 1</text><line x1="345" y1="680" x2="376" y2="680" stroke="#c96f50" stroke-width="2.4" stroke-dasharray="5 4" /><text x="385" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Upper band</text><line x1="500" y1="680" x2="531" y2="680" stroke="#c2a15a" stroke-width="2.4" stroke-dasharray="3 4" /><text x="540" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Middle line</text><line x1="656" y1="680" x2="687" y2="680" stroke="#8da88f" stroke-width="2.4" stroke-dasharray="5 4" /><text x="696" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Lower band</text><line x1="804" y1="680" x2="835" y2="680" stroke="#26392f" stroke-width="2.4" /><text x="844" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Price</text></svg>