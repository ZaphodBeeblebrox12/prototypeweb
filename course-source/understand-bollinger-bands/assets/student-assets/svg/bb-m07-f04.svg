<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>Three capstone decisions</title><desc>A disciplined loss can reflect good process; a winning rule-break can still be poor process. Original illustrative teaching diagram, not historical market data.</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbf7ef" stroke="none" /><text x="42" y="40" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#54795f">TRADETHESIS · LEARNING ROOM</text><text x="42" y="82" font-family="Georgia, serif" font-size="30" font-weight="700" text-anchor="start" fill="#26392f">Three capstone decisions</text><text x="42" y="114" font-family="system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#667266">A disciplined loss can reflect good process; a winning rule-break can still be poor process.</text><text x="1155" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#667266">MODULE 7 · RISK AND REVIEW</text><rect x="42" y="178" width="356" height="380" rx="14" fill="#fffdf8" stroke="#e3e0d4" /><rect x="57" y="198" width="326" height="9" rx="4" fill="#f6e5dc" stroke="none" /><text x="60" y="253" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#26392f">Disciplined losing trade</text><text x="60" y="296" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#667266">Loss occurred</text><text x="60" y="340" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#26392f">Rules followed</text><line x1="60" y1="363" x2="380" y2="363" stroke="#e4e3d8" stroke-width="2" /><text x="60" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#26392f">Evaluate process, not one outcome</text><text x="60" y="506" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#54795f">A sound process can lose</text><rect x="420" y="178" width="356" height="380" rx="14" fill="#fffdf8" stroke="#e3e0d4" /><rect x="435" y="198" width="326" height="9" rx="4" fill="#f3ead5" stroke="none" /><text x="438" y="253" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#26392f">Undisciplined winning trade</text><text x="438" y="296" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#667266">Profit occurred</text><text x="438" y="340" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#26392f">Rule was broken</text><line x1="438" y1="363" x2="758" y2="363" stroke="#e4e3d8" stroke-width="2" /><text x="438" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#26392f">A win does not repair the process</text><text x="438" y="506" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#c96f50">A win can hide poor process</text><rect x="798" y="178" width="356" height="380" rx="14" fill="#fffdf8" stroke="#e3e0d4" /><rect x="813" y="198" width="326" height="9" rx="4" fill="#e9eee5" stroke="none" /><text x="816" y="253" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#26392f">Defensible no-trade</text><text x="816" y="296" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#667266">No position opened</text><text x="816" y="340" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#26392f">Evidence was unclear</text><line x1="816" y1="363" x2="1136" y2="363" stroke="#e4e3d8" stroke-width="2" /><text x="816" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#26392f">Waiting can be valid</text><text x="816" y="506" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4f6978">No trade can be the plan</text><line x1="335" y1="680" x2="365" y2="680" stroke="#c96f50" stroke-width="2" stroke-dasharray="5 4" /><text x="374" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Upper band</text><line x1="490" y1="680" x2="520" y2="680" stroke="#c2a15a" stroke-width="2" stroke-dasharray="3 4" /><text x="529" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Middle line</text><line x1="645" y1="680" x2="675" y2="680" stroke="#8da88f" stroke-width="2" stroke-dasharray="5 4" /><text x="684" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Lower band</text><line x1="800" y1="680" x2="830" y2="680" stroke="#26392f" stroke-width="2" /><text x="839" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Price</text></svg>