<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>How the bands are constructed</title><desc>The centre average and equal chosen distances above and below it. Original illustrative conceptual diagram; not historical market data.</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbf7ef" stroke="none" /><text x="42" y="40" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#54795f">TRADETHESIS · LEARNING ROOM</text><text x="42" y="82" font-family="Georgia, serif" font-size="30" font-weight="700" text-anchor="start" fill="#26392f">How the bands are constructed</text><text x="42" y="114" font-family="system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#667266">The centre average and equal chosen distances above and below it.</text><text x="1155" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#667266">MODULE 2 · READ THE BANDS</text><rect x="45" y="150" width="1110" height="460" rx="16" fill="#fffdf8" stroke="#e3e0d4" /><text x="80" y="205" font-family="system-ui, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#26392f">Three related lines</text><line x1="105" y1="300" x2="1085" y2="300" stroke="#c96f50" stroke-width="4" stroke-dasharray="10 7" /><text x="1100" y="306" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#c96f50">Upper band</text><line x1="105" y1="390" x2="1085" y2="390" stroke="#c2a15a" stroke-width="4" /><text x="1100" y="396" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#c2a15a">Middle average</text><line x1="105" y1="480" x2="1085" y2="480" stroke="#8da88f" stroke-width="4" stroke-dasharray="10 7" /><text x="1100" y="486" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#54795f">Lower band</text><text x="80" y="555" font-family="system-ui, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#667266">Common reference: a 20-period moving average with outer bands two standard deviations away.</text><line x1="345" y1="680" x2="376" y2="680" stroke="#c96f50" stroke-width="2.4" stroke-dasharray="5 4" /><text x="385" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Upper band</text><line x1="500" y1="680" x2="531" y2="680" stroke="#c2a15a" stroke-width="2.4" stroke-dasharray="3 4" /><text x="540" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Middle line</text><line x1="656" y1="680" x2="687" y2="680" stroke="#8da88f" stroke-width="2.4" stroke-dasharray="5 4" /><text x="696" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Lower band</text><line x1="804" y1="680" x2="835" y2="680" stroke="#26392f" stroke-width="2.4" /><text x="844" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Price</text></svg>