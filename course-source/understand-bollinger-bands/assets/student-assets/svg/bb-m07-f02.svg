<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>Management is a pre-written path</title><desc>Choose an action that matches a defined condition instead of inventing rules mid-trade. Original illustrative teaching diagram, not historical market data.</desc><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbf7ef" stroke="none" /><text x="42" y="40" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#54795f">TRADETHESIS · LEARNING ROOM</text><text x="42" y="82" font-family="Georgia, serif" font-size="30" font-weight="700" text-anchor="start" fill="#26392f">Management is a pre-written path</text><text x="42" y="114" font-family="system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#667266">Choose an action that matches a defined condition instead of inventing rules mid-trade.</text><text x="1155" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#667266">MODULE 7 · RISK AND REVIEW</text><rect x="48" y="150" width="1104" height="455" rx="18" fill="#fffdf8" stroke="#e3e0d4" /><rect x="415" y="185" width="370" height="78" rx="10" fill="#f3ead5" stroke="#b9c4b5" /><text x="600" y="214" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#26392f">Entry condition</text><text x="600" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#667266">Trigger is met</text><line x1="600" y1="263" x2="600" y2="305" stroke="#26392f" stroke-width="2" /><line x1="592" y1="297" x2="600" y2="305" stroke="#26392f" stroke-width="2" /><line x1="608" y1="297" x2="600" y2="305" stroke="#26392f" stroke-width="2" /><rect x="400" y="305" width="400" height="78" rx="10" fill="#fffdf8" stroke="#b9c4b5" /><text x="600" y="334" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#26392f">Check the plan</text><text x="600" y="358" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#667266">Has invalidation occurred?</text><line x1="400" y1="344" x2="260" y2="344" stroke="#26392f" stroke-width="2" /><line x1="260" y1="344" x2="260" y2="395" stroke="#26392f" stroke-width="2" /><line x1="800" y1="344" x2="940" y2="344" stroke="#26392f" stroke-width="2" /><line x1="940" y1="344" x2="940" y2="395" stroke="#26392f" stroke-width="2" /><rect x="80" y="395" width="360" height="100" rx="10" fill="#f6e5dc" stroke="#b9c4b5" /><text x="260" y="424" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#26392f">Yes · Invalidation</text><text x="260" y="448" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#667266">Exit or reduce as written</text><rect x="760" y="395" width="360" height="100" rx="10" fill="#e9eee5" stroke="#b9c4b5" /><text x="940" y="424" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#26392f">No · Still valid</text><text x="940" y="448" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#667266">Continue to the next rule</text><text x="260" y="535" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#c96f50">Do not reverse automatically</text><text x="940" y="535" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#54795f">Use the pre-written action</text><line x1="335" y1="680" x2="365" y2="680" stroke="#c96f50" stroke-width="2" stroke-dasharray="5 4" /><text x="374" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Upper band</text><line x1="490" y1="680" x2="520" y2="680" stroke="#c2a15a" stroke-width="2" stroke-dasharray="3 4" /><text x="529" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Middle line</text><line x1="645" y1="680" x2="675" y2="680" stroke="#8da88f" stroke-width="2" stroke-dasharray="5 4" /><text x="684" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Lower band</text><line x1="800" y1="680" x2="830" y2="680" stroke="#26392f" stroke-width="2" /><text x="839" y="685" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#667266">Price</text></svg>