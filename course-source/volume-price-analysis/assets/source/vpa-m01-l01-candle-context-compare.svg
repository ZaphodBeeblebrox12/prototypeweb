<text x="72" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#252923">Key question: what did price achieve relative to the activity recorded?</text>
<text x="72" y="1050" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#5f625c">Similar candle shapes do not make the situations identical. Neither chart reveals hidden intent or determines what happens next.</text>
