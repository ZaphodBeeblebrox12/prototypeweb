<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">The same candle, different context</title>
<desc id="desc">Two synthetic candlestick charts with volume bars beneath. Panel A shows a similar green candle after a controlled pullback, with activity modestly above a five-bar baseline. Panel B shows a similar green candle after an extended advance near a prior high area, with activity clearly above its baseline. The chart illustrates why candle shape alone is not enough to interpret a move.</desc>
<rect width="1920" height="1080" fill="#f6f5f0"/>
<text x="70" y="72" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#252923">THE SAME CANDLE. DIFFERENT CONTEXT.</text>
<text x="72" y="112" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5f625c">Read the price result, compare recorded activity, then ask what evidence should come next.</text>
<rect x="1508" y="36" width="340" height="43" rx="21" fill="#e7e5dc" stroke="#d7d4ca"/>
