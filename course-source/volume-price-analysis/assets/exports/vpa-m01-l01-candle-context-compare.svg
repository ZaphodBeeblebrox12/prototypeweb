 <text x="62" y="1016" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#252923">The key skill: describe the evidence before deciding what it may mean.</text>
 <text x="62" y="1048" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#5f625c">The shared price scale makes candle dimensions comparable. Neither panel predicts the next move or reveals who traded.</text>
