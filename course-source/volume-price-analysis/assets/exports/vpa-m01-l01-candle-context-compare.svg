<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
 <title id="title">The same candle, different context</title>
 <desc id="desc">Two synthetic candlestick charts use the same vertical price scale. The highlighted candidate candles have identical OHLC dimensions. Panel A shows a candle after a pullback with candidate volume 185 against a preceding-five-bar average of 157. Panel B shows a candle near a prior-high area after an extended rise with candidate volume 420 against a baseline of 225. Volume bars are neutral grey except for the highlighted candidate; a dashed line marks each panel's previous-five-bar average.</desc>
 <rect width="1920" height="1080" fill="#f6f5f0"/>
 <text x="60" y="65" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#252923">THE SAME CANDLE. DIFFERENT CONTEXT.</text>
 <text x="62" y="103" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#5f625c">Read the price result, compare recorded activity, then ask what evidence should come next.</text>
 <rect x="1504" y="28" width="350" height="41" rx="20" fill="#e7e5dc" stroke="#d7d4ca"/>
 <text x="1679" y="54" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing=".7" fill="#53564f">SYNTHETIC TEACHING EXAMPLE</text>
 <rect x="61" y="127" width="1795" height="36" rx="7" fill="#eeede6"/>
 <text x="79" y="150" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#454b45">KEY: Neutral bars = recorded activity · dashed line = average of the five bars before the candidate · outline = candidate candle</text>
