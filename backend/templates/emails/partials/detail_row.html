<tr>

  <td align="right" valign="top" style="padding:10px 0;vertical-align:top;text-align:right;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;font-weight:650;color:#26372D;word-break:break-word;overflow-wrap:anywhere;border-bottom:1px solid #E9EEE8;{{ value_style|default:'' }}">{{ value }}</td>
